  </defs>
  <ellipse cx="100" cy="215" rx="48" ry="9" fill="#2B1219" opacity="0.14"/>
  <!-- ears -->
  <circle cx="55" cy="70" r="28" fill="url(#plush)"/>
  <circle cx="145" cy="70" r="28" fill="url(#plush)"/>
  <circle cx="55" cy="70" r="16" fill="#F5D6DA"/>
  <circle cx="145" cy="70" r="16" fill="#F5D6DA"/>
