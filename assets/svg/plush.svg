  <circle cx="100" cy="90" r="48" fill="url(#plush)"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="105" rx="22" ry="16" fill="#F8E8EA"/>
  <!-- eyes -->
  <circle cx="82" cy="85" r="6" fill="#3A2A24"/>
  <circle cx="118" cy="85" r="6" fill="#3A2A24"/>
  <circle cx="84" cy="83" r="2" fill="#FFF"/>
  <circle cx="120" cy="83" r="2" fill="#FFF"/>
